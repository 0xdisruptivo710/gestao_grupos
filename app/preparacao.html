<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparação · Painel de Grupos VIP — AIOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="preparacao">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content stack" style="gap:18px">

      <div class="page-head">
        <div>
          <h1>Preparação</h1>
          <p>O que precisa estar pronto antes de abrir o grupo, igual em todo cliente: as definições da campanha, o canal oficial no ar e a base de contatos tratada. Quem tem a marca <b>trava a grade</b> segura o roteiro inteiro — sem esses, não há o que gerar. Cada passo guarda quem mexeu e quando.</p>
        </div>
      </div>

      <section id="faixa"></section>

      <div id="blocos" class="stack" style="gap:18px"></div>

    </main>
  </div>
</div>

<script src="/js/clientes.js"></script>
<script src="/js/checklists.js"></script>
<script src="/js/store.js"></script>
<script src="/js/app.js"></script>
<script>
/* ---- Tela: Preparação ---------------------------------------------------- */
(function () {
  var S = window.Store, A = window.AIOS;

  S.pronto(function () {
    if (S.semCliente) return;

    /* um cartão por bloco, montado a partir de checklists.js */
    document.getElementById('blocos').innerHTML = window.CHECKLISTS.map(function (b) {
      return '<section class="card card-flush">' +
        '<div class="card-head">' +
          '<div>' +
            '<h2>' + A.esc(b.nome) + '</h2>' +
            '<p class="small muted" style="margin-top:2px">' + A.esc(b.resumo) + '</p>' +
          '</div>' +
          '<span class="badge" id="cont-' + b.id + '"></span>' +
        '</div>' +
        '<div id="lista-' + b.id + '"></div>' +
      '</section>';
    }).join('');

    var listas = window.CHECKLISTS.map(function (b) {
      return { bloco: b, ui: A.checklist('lista-' + b.id, b, pinta) };
    });

    pinta();

    function pinta() {
      var geral = window.progressoChecklists(S.dados.preparacao);

      /* quanto falta em cada bloco */
      var porBloco = window.CHECKLISTS.map(function (b) {
        var contas = { feito: 0, parcial: 0, na: 0, pendente: 0 };
        b.passos.forEach(function (p) { contas[S.estadoPrep(p.id)]++; });
        var resolvidos = contas.feito + contas.na;
        var el = document.getElementById('cont-' + b.id);
        if (el) {
          el.textContent = resolvidos + ' de ' + b.passos.length;
          el.className = 'badge' + (resolvidos === b.passos.length ? ' ok' : '');
        }
        return { b: b, resolvidos: resolvidos, total: b.passos.length, contas: contas };
      });

      /* o primeiro passo em aberto, na ordem */
      var proximo = null;
      for (var i = 0; i < window.CHECKLISTS.length && !proximo; i++) {
        var bl = window.CHECKLISTS[i];
        for (var j = 0; j < bl.passos.length; j++) {
          var e = S.estadoPrep(bl.passos[j].id);
          if (e === 'pendente' || e === 'parcial') { proximo = bl.passos[j]; break; }
        }
      }

      /* Bloqueio vem primeiro e em destaque: é a diferença entre "falta
         coisa" e "não dá para gerar roteiro nenhum". */
      var b = geral.bloqueios;
      A.faixa('faixa', [
        b.length
          ? { k: 'Travando a grade', v: b.length, destaque: true,
              n: b.map(function (x) { return x.titulo; }).slice(0, 2).join(' · ') +
                 (b.length > 2 ? ' e mais ' + (b.length - 2) : '') }
          : { k: 'Nada travando', v: '&#10003;', destaque: true,
              n: 'os passos que seguram o roteiro estão resolvidos' },
        { k: 'Preparação concluída', v: geral.pct + '<span class="un">%</span>',
          vazio: !geral.resolvidos, barra: geral.pct,
          n: geral.resolvidos + ' de ' + geral.total + ' passos' +
             (geral.parciais ? ' · ' + geral.parciais + (geral.parciais > 1 ? ' parciais' : ' parcial') : '') +
             (geral.na ? ' · ' + geral.na + ' não se aplica' : '') }
      ].concat(porBloco.map(function (x) {
        return {
          k: x.b.nome, v: x.resolvidos + ' / ' + x.total, vazio: !x.resolvidos,
          barra: Math.round(x.resolvidos / x.total * 100),
          n: x.resolvidos === x.total
            ? 'bloco concluído'
            : (x.total - x.resolvidos) + ' em aberto' +
              (x.contas.parcial ? ' (' + x.contas.parcial + ' parcial)' : '')
        };
      })).concat([
        { k: 'Próximo passo', v: proximo ? '&rarr;' : '&#10003;', vazio: !proximo,
          n: proximo ? proximo.titulo : 'nada em aberto' }
      ]));
    }
  });
})();
</script>
</body>
</html>
